<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0f2847"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c853;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00e676;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern (subtle) -->
  <g opacity="0.06" stroke="#00c853" stroke-width="0.5" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Circuit-like decorative elements -->
  <g stroke="#00c853" stroke-width="1.5" fill="none" opacity="0.15">
    <!-- Left circuit -->
    <circle cx="120" cy="150" r="4"/>
    <line x1="120" y1="154" x2="120" y2="220"/>
    <circle cx="120" cy="220" r="3"/>
    <line x1="124" y1="220" x2="200" y2="220"/>
    <circle cx="200" cy="220" r="4"/>
    <line x1="200" y1="224" x2="200" y2="300"/>
    
    <!-- Right circuit -->
    <circle cx="1080" cy="480" r="4"/>
    <line x1="1080" y1="476" x2="1080" y2="410"/>
    <circle cx="1080" cy="410" r="3"/>
    <line x1="1076" y1="410" x2="1000" y2="410"/>
    <circle cx="1000" cy="410" r="4"/>
    <line x1="1000" y1="406" x2="1000" y2="340"/>
  </g>
  
  <!-- Glow line at top -->
  <rect x="300" y="200" width="600" height="2" fill="url(#glow)" rx="1"/>
  
  <!-- Lightning bolt icon (IoT symbol) -->
  <g transform="translate(570, 240)" fill="#00e676" opacity="0.9">
    <polygon points="60,0 30,50 55,50 25,100 90,35 60,35 85,0"/>
  </g>
  
  <!-- Main title: IoTHub -->
  <text x="600" y="380" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="2">
    IoT<tspan fill="#00e676">Hub</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="600" y="425" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#90a4ae" letter-spacing="3" text-transform="uppercase">
    TUTORIAL TEKNOLOGI IoT, JARINGAN &amp; MIKROKONTROLER
  </text>
  
  <!-- Bottom decorative line -->
  <rect x="400" y="460" width="400" height="1" fill="#00c853" opacity="0.4" rx="0.5"/>
  
  <!-- Website URL -->
  <text x="600" y="500" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#546e7a" letter-spacing="1">
    beebane25.github.io/iothub
  </text>
</svg>
