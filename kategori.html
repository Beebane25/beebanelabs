<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Jelajahi tutorial IoT berdasarkan kategori: ESP32, MikroTik, LoRa, Python, Dashboard, dan lainnya.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand"><div class="brand-icon">⚡</div><span>IoTHub</span></a>
      <ul class="navbar-links" id="navLinks">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="kategori.html" class="active">Kategori</a></li>
        <li><a href="index.html#articles">Artikel</a></li>
        <li><a href="pricing.html">Harga</a></li>
      </ul>
      <div id="authNavArea"></div>
      <button class="theme-toggle" onclick="ThemeToggle.toggle()" title="Ganti tema">☀️</button>
    </div>
  </nav>

  <section class="article-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Beranda</a><span class="separator">›</span><span>Kategori</span></div>
      <h1>📚 Semua Kategori</h1>
      <div class="meta-row"><span class="meta-item">📖 21 Tutorial</span><span class="meta-item">🏷️ 11 Kategori</span></div>
    </div>
  </section>

  <section style="padding:40px 0 80px;">
    <div class="container">
      <div class="category-grid" id="categoryGrid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 IoTHub. Semua hak dilindungi.</p>
        <div class="social-links"><a href="https://github.com/Beebane25">GitHub</a><a href="#">YouTube</a><a href="#">Discord</a></div>
      </div>
    </div>
  </footer>
  <button class="back-to-top" id="backToTop" aria-label="Kembali ke atas">↑</button>
  <script src="js/app.js?v=5.0.0"></script>
  <script>
    const categories = [
      { slug: 'esp32', name: 'ESP32 & ESP8266', icon: '🔧', desc: 'Pemrograman mikrokontroler populer untuk proyek IoT', count: 5, color: 'cyan' },
      { slug: 'mikrotik', name: 'MikroTik & Jaringan', icon: '🌐', desc: 'Konfigurasi router, firewall, VPN, dan manajemen jaringan', count: 3, color: 'orange' },
      { slug: 'lora', name: 'LoRa & LPWAN', icon: '📡', desc: 'Komunikasi jarak jauh untuk sensor IoT', count: 1, color: 'green' },
      { slug: 'python', name: 'Python untuk IoT', icon: '🐍', desc: 'Otomasi dan scripting untuk perangkat IoT', count: 1, color: 'purple' },
      { slug: 'keamanan', name: 'Keamanan Jaringan', icon: '🔐', desc: 'Firewall, VPN, dan enkripsi data IoT', count: 1, color: 'red' },
      { slug: 'dashboard', name: 'Dashboard & Visualisasi', icon: '📊', desc: 'Node-RED, Grafana, dan monitoring real-time', count: 3, color: 'cyan' },
      { slug: 'protokol', name: 'Protokol IoT', icon: '📨', desc: 'MQTT, CoAP, HTTP, dan protokol komunikasi', count: 2, color: 'green' },
      { slug: 'raspberry-pi', name: 'Raspberry Pi', icon: '🍓', desc: 'Gateway dan edge computing untuk IoT', count: 1, color: 'red' },
      { slug: 'cloud', name: 'Cloud & Firebase', icon: '🔥', desc: 'Penyimpanan data cloud dan real-time database', count: 1, color: 'orange' },
      { slug: 'iot', name: 'IoT Lainnya', icon: '🤖', desc: 'Telegram Bot, Blynk, dan kontrol perangkat', count: 2, color: 'purple' },
      { slug: 'tools', name: 'Tools & IDE', icon: '💻', desc: 'Arduino IDE dan tools pengembangan', count: 1, color: 'green' }
    ];
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = categories.map(c => '<a href="kategori/' + c.slug + '.html" class="category-card"><div class="cat-icon">' + c.icon + '</div><h3>' + c.name + '</h3><p>' + c.desc + '</p><span class="cat-count">' + c.count + ' Artikel</span></a>').join('');
  </script>
</body>
</html>
