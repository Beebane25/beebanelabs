[vars]
# Environment variables untuk local development
# Untuk production, set di Cloudflare Dashboard → Functions → Settings → Environment variables

# Supabase
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_SERVICE_KEY = "YOUR_SERVICE_KEY"

# Midtrans
MIDTRANS_SERVER_KEY = "YOUR_SERVER_KEY"
MIDTRANS_IS_PRODUCTION = "false"
