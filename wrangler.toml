# Cloudflare Pages Functions environment variables
# IMPORTANT: These are placeholder values for local development only!
# Production values MUST be set in: Cloudflare Dashboard > Pages > iothub > Settings > Environment variables
# Required env vars: SUPABASE_URL, SUPABASE_SERVICE_KEY, MIDTRANS_SERVER_KEY

[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_SERVICE_KEY = "YOUR_SERVICE_KEY"
MIDTRANS_SERVER_KEY = "YOUR_SERVER_KEY"
MIDTRANS_IS_PRODUCTION = "false"
