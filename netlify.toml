[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://iothub25.netlify.app"
    Access-Control-Allow-Headers = "Content-Type, X-CSRF-Token"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.sandbox.midtrans.com https://app.midtrans.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.sandbox.midtrans.com https://api.midtrans.com; frame-src https://app.sandbox.midtrans.com https://app.midtrans.com"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
